name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e "const manifest = require('./manifest.json'); if (manifest.version !== process.env.RELEASE_TAG) { console.error('Tag must exactly match manifest version (no v prefix).'); process.exit(1); }"

      - name: Verify source
        run: |
          npm test
          npm run lint
          npm run build

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --title "$GITHUB_REF_NAME" --generate-notes
